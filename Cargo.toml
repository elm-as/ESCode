# Workspace racine : le cœur Mission Control est partagé entre l'app Tauri
# et le binaire `elmas-mc` embarqué dans l'extension VSCodium (ADR-008).
[workspace]
resolver = "2"
members = ["src-tauri", "crates/mission-control-core", "crates/elmas-mc"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

